name: db-scheduler

on:
  push:
    branches: [main]
    paths: ["db-scheduler/**", ".github/workflows/db-scheduler.yml"]
  pull_request:
    paths: ["db-scheduler/**", ".github/workflows/db-scheduler.yml"]
  # The "Run workflow" button in the Actions tab (and `gh workflow run db-scheduler.yml`).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned as in ci.yml: left to the runner, uv takes the newest Python it has, for which
  # psycopg-binary may have no build yet.
  UV_PYTHON: "3.14"
  # Runners are disposable VMs; don't fail before tests start if Docker Hub cannot serve the
  # optional Testcontainers Ryuk reaper image.
  TESTCONTAINERS_RYUK_DISABLED: "true"

defaults:
  run:
    working-directory: db-scheduler

jobs:
  static:
    name: types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy

  fast:
    name: tests (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest

  compatibility:
    # db-scheduler proves its repository against every database it claims to support, with one
    # CompatibilityTest per dialect. This is that, and it is where the claim actually rests -
    # SQLite keeps the inner loop fast and proves nothing about MySQL's locking.
    #
    # MySQL runs twice on purpose. 8.4 is the LTS most deployments are on; 26.x is the current
    # release, and it is where a change in behaviour would show up first. They exercise
    # different branches of the version check in AutodetectJdbcCustomization, so a regression in
    # either would otherwise be invisible.
    name: compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: postgres 17, dialect: postgres, image: "postgres:17-alpine" }
          - { name: mysql 8.4 LTS, dialect: mysql, image: "mysql:8.4" }
          - { name: mysql 26.7, dialect: mysql, image: "mysql:26.7" }
          - { name: mariadb 11.4, dialect: mariadb, image: "mariadb:11.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest tests/integration --dialects=${{ matrix.dialect }}
        env:
          # Pinned, so a base-image change is a commit rather than a surprise.
          DB_SCHEDULER_POSTGRES_IMAGE: ${{ matrix.image }}
          DB_SCHEDULER_MYSQL_IMAGE: ${{ matrix.image }}
          DB_SCHEDULER_MARIADB_IMAGE: ${{ matrix.image }}

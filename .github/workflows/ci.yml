name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  fast:
    name: tests (unit, then sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      # No database at all, and first, so a broken invariant is reported in a second rather
      # than after four containers have started.
      - run: uv run pytest tests/unit
      - run: uv run pytest --dialects=sqlite

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      # An example nobody runs is an example that rots.
      - run: uv run pytest examples
      - run: uv run python -m examples.wallet_service

  tracing:
    # The span names are a cross-language contract - an operator filtering a trace on
    # `ekbatan.action.name` is filtering across both implementations. Only this job installs
    # OpenTelemetry; every other one proves the framework runs without it.
    name: tests (with a tracing stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --group tracing
      - run: uv run pytest --dialects=sqlite

  dialects:
    # The claim that this framework works is a claim about these three. SQLite is what keeps
    # the inner loop fast; it is not a supported dialect and proves nothing on its own.
    name: tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=${{ matrix.dialect }}
        env:
          # Set explicitly so a base-image change is a commit rather than a surprise.
          EKBATAN_POSTGRES_IMAGE: postgres:17-alpine
          EKBATAN_MYSQL_IMAGE: mysql:8.4
          EKBATAN_MARIADB_IMAGE: mariadb:11.4

  non_utc:
    # The timestamp defects are invisible under a UTC process, which is where suites usually
    # run. This is the job that would have caught a driver inferring a zoned type.
    name: tests (postgres, non-UTC process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=postgres
        env:
          TZ: America/New_York

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --group examples
      # Generated modules are gitignored, as Java's `build/generated-jooq` is, and mypy
      # reads them - so this job generates first, exactly as compiling in Java does.
      - run: make lint

  fast:
    name: tests (unit, then sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      # No database at all, and first, so a broken invariant is reported in a second rather
      # than after four containers have started.
      - run: uv run pytest tests/unit
      - run: uv run pytest --dialects=sqlite

  gevent:
    name: tests (under gevent monkey-patching)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      # The framework is synchronous and imports no gevent, so under monkey-patching it becomes
      # concurrent for free - every blocking call yields, which is the thing the asyncio answer
      # cannot offer. The docs say so; this is what stops that becoming a sentence nobody
      # rechecked. The whole suite runs, container tests included.
      - run: make test-gevent

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # Each example is a project of its own - seven, built three ways each - with its own
      # environment, so nothing is synced here. The pip ones need a Python of 3.13 or later, which
      # uv provides; the Poetry ones need `poetry`.
      - run: uv python install 3.13
      - run: uv tool install poetry
      # An example nobody runs is an example that rots - and one did. The payload assertion in
      # `wallet_service_sqlite` went stale at EKB-0129 and stayed that way, because this repository
      # has no remote and so this file has never actually run. When it does, it catches that.
      # `make` builds each one's generated schema first, tests each as its built wheel installed,
      # and cannot drift from the Makefile.
      - run: make examples

  tracing:
    # The span names are a cross-language contract - an operator filtering a trace on
    # `ekbatan.action.name` is filtering across both implementations. Only this job installs
    # OpenTelemetry; every other one proves the framework runs without it.
    name: tests (with a tracing stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --group tracing
      - run: uv run pytest --dialects=sqlite

  dialects:
    # The claim that this framework works is a claim about these three. SQLite is what keeps
    # the inner loop fast; it is not a supported dialect and proves nothing on its own.
    name: tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=${{ matrix.dialect }}
        env:
          # Set explicitly so a base-image change is a commit rather than a surprise.
          EKBATAN_POSTGRES_IMAGE: postgres:17-alpine
          EKBATAN_MYSQL_IMAGE: mysql:8.4
          EKBATAN_MARIADB_IMAGE: mariadb:11.4

  non_utc:
    # The timestamp defects are invisible under a UTC process, which is where suites usually
    # run. This is the job that would have caught a driver inferring a zoned type.
    name: tests (postgres, non-UTC process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=postgres
        env:
          TZ: America/New_York

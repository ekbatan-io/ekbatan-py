name: CI

on:
  push:
    branches: [main]
    # Skip CI when a push only changes `website/**`: those go through deploy-website.yml, which
    # runs the website's own checks and the Python ones that read it. GitHub skips the workflow
    # only if EVERY changed path matches; a push that also touches the framework still runs CI.
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
  # The "Run workflow" button in the Actions tab (and `gh workflow run ci.yml`).
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Python every job runs on, pinned as Java's CI pins JDK 25. Left to the runner, uv took the
  # newest one it had - 3.15, for which psycopg-binary has no build yet - and every job failed
  # installing.
  UV_PYTHON: "3.14"
  # GitHub-hosted runners are disposable VMs, so runner teardown cleans up test containers. Avoid
  # failing CI before tests start if Docker Hub cannot serve the optional Ryuk reaper image.
  TESTCONTAINERS_RYUK_DISABLED: "true"

# The examples are not here: like Java's, they run in heavy-verification.yml, nightly, on the
# commit's own build.

jobs:
  static:
    name: types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --group examples
      # Generated modules are gitignored, as Java's `build/generated-jooq` is, and mypy
      # reads them - so this job generates first, exactly as compiling in Java does.
      - run: make lint

  fast:
    name: tests (unit, then sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # The `examples` group too: the tests that drive FastAPI, Starlette, anyio and uvicorn
      # skip without it, and this is the job that runs them.
      - run: uv sync --all-extras --group examples
      # No database at all, and first, so a broken invariant is reported in a second rather
      # than after four containers have started.
      - run: uv run pytest tests/unit
      - run: uv run pytest --dialects=sqlite

  gevent:
    name: tests (under gevent monkey-patching)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      # The framework is synchronous and imports no gevent, so under monkey-patching it becomes
      # concurrent for free - every blocking call yields, which is the thing the asyncio answer
      # cannot offer. The docs say so; this is what stops that becoming a sentence nobody
      # rechecked. The whole suite runs, container tests included.
      - run: make test-gevent

  tracing:
    # The span names are a cross-language contract - an operator filtering a trace on
    # `ekbatan.action.name` is filtering across both implementations. Only this job installs
    # OpenTelemetry; every other one proves the framework runs without it.
    name: tests (with a tracing stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --group tracing
      - run: uv run pytest --dialects=sqlite

  dialects:
    # The claim that this framework works is a claim about these three. SQLite is what keeps
    # the inner loop fast; it is not a supported dialect and proves nothing on its own.
    name: tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=${{ matrix.dialect }}
        env:
          # Set explicitly so a base-image change is a commit rather than a surprise.
          EKBATAN_POSTGRES_IMAGE: postgres:17-alpine
          EKBATAN_MYSQL_IMAGE: mysql:8.4
          EKBATAN_MARIADB_IMAGE: mariadb:11.4

  psycopg_async:
    # The async runs on PostgreSQL use asyncpg by default; this proves psycopg's own async mode
    # (`postgresql+psycopg_async://`) with the same scenarios.
    name: tests (postgres, ekbatan.aio on psycopg async)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: make test-psycopg-async
        env:
          EKBATAN_POSTGRES_IMAGE: postgres:17-alpine

  non_utc:
    # The timestamp defects are invisible under a UTC process, which is where suites usually
    # run. This is the job that would have caught a driver inferring a zoned type.
    name: tests (postgres, non-UTC process)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras
      - run: uv run pytest --dialects=postgres
        env:
          TZ: America/New_York

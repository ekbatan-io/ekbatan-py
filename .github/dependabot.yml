# Dependabot opens pull requests for newer GitHub Actions in .github/workflows, and for newer npm
# packages of the website (website/package.json and its lock file).
#
# It does not update the Python packages: those are pinned in uv.lock and db-scheduler/uv.lock
# and moved with `uv lock --upgrade`, and .github/workflows/dependency-check.yml reports newer
# versions and known vulnerabilities for them.
#
# `cooldown` makes Dependabot wait until a release is 14 days old before proposing it, the same
# wait `exclude-newer` gives uv in pyproject.toml. Fixes for known vulnerabilities don't wait:
# the cooldown applies only to ordinary version updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      # Patch and minor releases together in one pull request; each major release on its own.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      # Patch and minor releases together in one pull request; each major release on its own.
      website:
        patterns: ["*"]
        update-types: [minor, patch]

[project]
name = "ekbatan-py-db-scheduler"
version = "0.1.0.dev0"
description = "A port of kagkarlsson/db-scheduler: persistent, cluster-friendly scheduling on the database you already have."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "SQLAlchemy>=2.0.30",
    # Cron parsing only. db-scheduler uses cron-utils; this is the equivalent single-purpose
    # dependency rather than a scheduling framework of its own.
    "croniter>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["PyMySQL>=1.1"]
mariadb = ["PyMySQL>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "testcontainers[postgres,mysql]>=4.15",
    "psycopg[binary]>=3.2",
    "PyMySQL>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The library is fully typed and mypy-clean; the marker is what lets a consumer see that.
packages = ["src/db_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Basenames repeat across unit/ and integration/, as they do in the Java suite.
addopts = "--import-mode=importlib -q"
markers = [
    "compatibility: runs against a real database in a container",
    "cluster: several schedulers competing, against a real database",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET", "SLF", "TID"]
# TID252 bans importing from a parent package. Inside one package that is how a subpackage
# reaches its own root, and rewriting it absolute would hard-code the distribution name into
# every module.
ignore = ["E501", "TID252"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
# N818 wants every exception to end in "Error". These names are db-scheduler's, and a reader
# moving between the two implementations should find the same word; the convention loses.
"src/db_scheduler/task/schedule/__init__.py" = ["N818"]
"src/db_scheduler/exceptions.py" = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# The service's Ekbatan settings: the database, the namespace, the jobs and the event handling.
# Read by `app.build` through `ekbatan.config_files.load_ekbatan_config`.
#
# One database. `${NAME:default}` is an environment variable with a default, so the file runs as
# it is against the server in compose.yaml; the test fills them from its container.
ekbatan:
  namespace: example.wallet.saga
  sharding:
    defaultShard:
      group: 0
      member: 0
    groups:
      - group: 0
        name: default
        members:
          - member: 0
            name: default
            configs:
              # Requests and the saga's steps. Past poolSize they queue, for at most poolTimeout
              # seconds, then fail.
              primaryConfig:
                # Postgres shows application_name in pg_stat_activity; options puts every session
                # on UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  application_name: wallet-service
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                # The login lives here, never in the url - a url is logged and repeated.
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 10
                poolTimeout: 5
              # The event handlers', async, on dispatch's handler loop and nowhere else.
              handlersConfig:
                dataSourceProperties:
                  application_name: wallet-handlers
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 5
              # The scheduler's own pool, which the fan-out and handling jobs run on.
              jobsConfig:
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 8
              # Held lock leases - the deposit's. One connection per lease held at once.
              lockConfig:
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 5

  # Every step of the saga but the first is started by an in-process event handler picking up
  # the step before's event - so the saga depends on the event handling job running.
  local-event-handler:
    handling:
      enabled: true

[project]
name = "fastapi-wallet-rest-sharded-pg"
version = "0.1.0"
description = "A wallet service over HTTP on two PostgreSQL databases, built with pip and setuptools."
requires-python = ">=3.13"
dependencies = ["ekbatan[postgres,migrations]", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[postgres]>=4.15", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# setuptools packs only .py files unless told. The service reads these at startup.
[tool.setuptools.package-data]
fastapi_wallet_rest_sharded_pg = ["ekbatan.yaml", "migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"

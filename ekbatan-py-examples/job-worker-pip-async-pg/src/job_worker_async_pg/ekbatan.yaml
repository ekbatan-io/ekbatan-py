# The worker's Ekbatan settings: the shard layout, the namespace, the jobs and the event
# handling. Read by `app.build` through `ekbatan.config_files.load_ekbatan_config`.
#
# Two shards, global and mexico, each its own database on its own server. `${NAME:default}` is an
# environment variable with a default, so the file runs as it is against the servers in
# compose.yaml and the same file runs anywhere else with the variables set. The tests fill them
# from their containers.
ekbatan:
  namespace: example.wallet.worker
  sharding:
    defaultShard:
      group: 0
      member: 0
    groups:
      - group: 0
        name: global
        members:
          - member: 0
            name: global
            configs:
              # The work: the jobs' bodies and the event handler.
              primaryConfig:
                # Extra driver settings, each name exactly as the driver spells it; handed to the
                # driver beside the url, never printed.
                # Postgres shows application_name in pg_stat_activity; options puts every session
                # on UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  application_name: wallet-service
                  options: -c TimeZone=UTC
                url: ${WALLET_GLOBAL_URL:postgresql+psycopg://localhost:5432/wallet_global}
                # The login lives here, never in the url - a url is logged and repeated.
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 10
                poolTimeout: 5
              # The scheduler. At least twice the job worker threads: a job body holding the last
              # connection would starve the heartbeat. Warned at startup if short.
              jobsConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_GLOBAL_URL:postgresql+psycopg://localhost:5432/wallet_global}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 8
              # Held lock leases. One connection per lease that can be held at once.
              lockConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_GLOBAL_URL:postgresql+psycopg://localhost:5432/wallet_global}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 5
      - group: 1
        name: mexico
        members:
          - member: 0
            name: mexico
            configs:
              # The work: the jobs' bodies and the event handler.
              primaryConfig:
                # Extra driver settings, each name exactly as the driver spells it; handed to the
                # driver beside the url, never printed.
                # Postgres shows application_name in pg_stat_activity; options puts every session
                # on UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  application_name: wallet-service
                  options: -c TimeZone=UTC
                url: ${WALLET_MEXICO_URL:postgresql+psycopg://localhost:5433/wallet_mexico}
                # The login lives here, never in the url - a url is logged and repeated.
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 10
                poolTimeout: 5
              # The scheduler. At least twice the job worker threads: a job body holding the last
              # connection would starve the heartbeat. Warned at startup if short.
              jobsConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_MEXICO_URL:postgresql+psycopg://localhost:5433/wallet_mexico}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 8
              # Held lock leases. One connection per lease that can be held at once.
              lockConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_MEXICO_URL:postgresql+psycopg://localhost:5433/wallet_mexico}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 5

  # ISO-8601 durations. The test tightens this one; ten seconds is a worker's pace.
  jobs:
    pollingInterval: PT10S

  local-event-handler:
    handling:
      enabled: true

[project]
name = "job-worker-async-pg"
version = "0.1.0"
description = "A worker running distributed jobs whose work is async, no HTTP, built with pip and setuptools."
requires-python = ">=3.13"
dependencies = ["ekbatan[postgres,postgres-async,migrations]"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[postgres]>=4.15"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# setuptools packs only .py files unless told. The service reads these at startup.
[tool.setuptools.package-data]
job_worker_async_pg = ["ekbatan.yaml", "migrations/*.sql"]

# schemagen's settings, as Java's build script carries jOOQ's: `make schema` runs
# `python -m ekbatan.schemagen`, which reads them. A flag on the command wins.
[tool.ekbatan.schemagen]
migrations = "src/job_worker_async_pg/migrations"
out = "src/job_worker_async_pg/schema.py"
image = "postgres:17-alpine"

# Every CHAR(3) column is a currency code, so the rule picks columns by their type.
[[tool.ekbatan.schemagen.forced-types]]
converter = "job_worker_async_pg.converters.CurrencyConverter"
include-types = "CHAR\\(3\\)"

# One column, picked by its name.
[[tool.ekbatan.schemagen.forced-types]]
converter = "job_worker_async_pg.converters.EmailAddressConverter"
include-expression = "alerts\\.recipient"

[tool.pytest.ini_options]
addopts = "-q"

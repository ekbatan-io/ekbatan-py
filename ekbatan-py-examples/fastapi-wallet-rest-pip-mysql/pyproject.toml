[project]
name = "fastapi-wallet-rest-mysql"
version = "0.1.0"
description = "A wallet service over HTTP on MySQL, built with pip and setuptools."
requires-python = ">=3.13"
dependencies = ["ekbatan[mysql,migrations]", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[mysql]>=4.15", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# setuptools packs only .py files unless told. The service reads these at startup.
[tool.setuptools.package-data]
fastapi_wallet_rest_mysql = ["ekbatan.yaml", "migrations/*.sql"]

# schemagen's settings, as Java's build script carries jOOQ's: `make schema` runs
# `python -m ekbatan.schemagen`, which reads them. A flag on the command wins.
[tool.ekbatan.schemagen]
migrations = "src/fastapi_wallet_rest_mysql/migrations"
out = "src/fastapi_wallet_rest_mysql/schema.py"
image = "mysql:8.4"

# A uuid is stored as CHAR(36) here, like any text, so say which columns hold one: the ids.
[[tool.ekbatan.schemagen.forced-types]]
name = "uuid_column"
include-types = "CHAR\\(36\\)"
include-expression = ".*\\.id|.*_id"

# Every CHAR(3) column is a currency code, so the rule picks columns by their type.
[[tool.ekbatan.schemagen.forced-types]]
converter = "fastapi_wallet_rest_mysql.converters.CurrencyConverter"
include-types = "CHAR\\(3\\)"

[tool.pytest.ini_options]
addopts = "-q"

[project]
name = "wallet-service-async-sqlite"
version = "0.1.0"
description = "A wallet, end to end, on SQLite, on native asyncio, built with uv."
requires-python = ">=3.13"
dependencies = ["ekbatan[sqlite-async]"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"

# ekbatan is not on PyPI yet. Until it is, it - and its scheduler - come from this
# repository; delete this once it is published.
[tool.uv.sources]
ekbatan = { path = "../..", editable = true }
ekbatan-py-db-scheduler = { path = "../../db-scheduler", editable = true }

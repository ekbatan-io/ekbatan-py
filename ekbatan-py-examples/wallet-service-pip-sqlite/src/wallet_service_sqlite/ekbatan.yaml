# The service's Ekbatan settings: the two files, the namespace and the handling switch. Read by
# `app.build` through `ekbatan.config_files.load_ekbatan_config`.
#
# Two shards, global and mexico, each a SQLite file of its own. `${NAME:default}` is an
# environment variable with a default; the script and the test each point them at files in a
# temporary directory. SQLite has no login, so none is given.
ekbatan:
  namespace: example.wallet
  sharding:
    defaultShard:
      group: 0
      member: 0
    groups:
      - group: 0
        name: global
        members:
          - member: 0
            name: global
            configs:
              primaryConfig:
                url: ${WALLET_GLOBAL_URL:sqlite:///wallet_global.db}
      - group: 1
        name: mexico
        members:
          - member: 0
            name: mexico
            configs:
              primaryConfig:
                url: ${WALLET_MEXICO_URL:sqlite:///wallet_mexico.db}

  local-event-handler:
    handling:
      enabled: true

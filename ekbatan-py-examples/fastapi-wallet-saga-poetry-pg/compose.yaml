# The databases `make run` starts, and stops when the app stops. Written by
# scripts/sync-examples.py: the image the tests use, the login and database
# ekbatan.yaml defaults to.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ekbatan
      POSTGRES_PASSWORD: ekbatan
      POSTGRES_DB: wallet
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ekbatan -d wallet"]
      interval: 1s
      timeout: 5s
      retries: 60

[project]
name = "job-worker-async-pg"
version = "0.1.0"
description = "A worker running distributed jobs whose work is async, no HTTP, built with Poetry."
requires-python = ">=3.13"
dependencies = [
    "ekbatan[postgres,postgres-async,migrations]",
    # ekbatan's own dependency, listed only so that the path below applies to it: Poetry
    # applies [tool.poetry.dependencies] only to what is listed here. Delete with that.
    "ekbatan-py-db-scheduler",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "job_worker_async_pg", from = "src" }]

# Poetry leaves a gitignored file out of the package, and schema.py is one. Name it.
[[tool.poetry.include]]
path = "src/job_worker_async_pg/schema.py"
format = ["sdist", "wheel"]

# ekbatan is not on PyPI yet. Until it is, it - and its scheduler - come from this
# repository; delete this once it is published.
[tool.poetry.dependencies]
ekbatan = { path = "../..", develop = true }
ekbatan-py-db-scheduler = { path = "../../db-scheduler", develop = true }

[tool.poetry.group.dev.dependencies]
# The schema generator: a build step, never a runtime dependency.
ekbatan = { path = "../..", develop = true, extras = ["codegen"] }
pytest = ">=8.0"
testcontainers = { version = ">=4.15", extras = ["postgres"] }

# schemagen's settings, as Java's build script carries jOOQ's: `make schema` runs
# `python -m ekbatan.schemagen`, which reads them. A flag on the command wins.
[tool.ekbatan.schemagen]
migrations = "src/job_worker_async_pg/migrations"
out = "src/job_worker_async_pg/schema.py"
image = "postgres:17-alpine"

# Every CHAR(3) column is a currency code, so the rule picks columns by their type.
[[tool.ekbatan.schemagen.forced-types]]
converter = "job_worker_async_pg.converters.CurrencyConverter"
include-types = "CHAR\\(3\\)"

[tool.pytest.ini_options]
addopts = "-q"

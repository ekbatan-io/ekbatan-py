[project]
name = "fastapi-wallet-saga-pg"
version = "0.1.0"
description = "A transfer across two databases, as a saga, built with pip and setuptools."
requires-python = ">=3.13"
dependencies = ["ekbatan[postgres]", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[postgres]>=4.15", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# setuptools packs only .py files unless told. The service reads these at startup.
[tool.setuptools.package-data]
fastapi_wallet_saga_pg = ["ekbatan.yaml", "migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"

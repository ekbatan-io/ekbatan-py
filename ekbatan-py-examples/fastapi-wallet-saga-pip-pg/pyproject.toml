[project]
name = "fastapi-wallet-saga-pg"
version = "0.1.0"
description = "A transfer across two databases, as a saga, built with pip and setuptools."
requires-python = ">=3.13"
dependencies = ["ekbatan[postgres,migrations]", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[postgres]>=4.15", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# setuptools packs only .py files unless told. The service reads these at startup.
[tool.setuptools.package-data]
fastapi_wallet_saga_pg = ["ekbatan.yaml", "migrations/*.sql"]

# schemagen's settings, as Java's build script carries jOOQ's: `make schema` runs
# `python -m ekbatan.schemagen`, which reads them. A flag on the command wins.
[tool.ekbatan.schemagen]
migrations = "src/fastapi_wallet_saga_pg/migrations"
out = "src/fastapi_wallet_saga_pg/schema.py"
image = "postgres:17-alpine"

[tool.pytest.ini_options]
addopts = "-q"

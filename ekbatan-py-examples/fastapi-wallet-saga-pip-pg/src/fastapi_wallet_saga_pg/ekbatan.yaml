# The service's Ekbatan settings - the same keys, in the same places, as the Java examples'
# application.yml. Read by `app.build` through `ekbatan.config_files.load_ekbatan_config`.
#
# `${NAME:default}` is an environment variable with a default, so the file runs as it is against
# a local server; the test fills them from its container.
ekbatan:
  namespace: example.fastapi_wallet_saga_pg
  sharding:
    defaultShard:
      group: 0
      member: 0
    groups:
      - group: 0
        name: global
        members:
          - member: 0
            name: global
            configs:
              primaryConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  application_name: wallet-service
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                # The login lives here, never in the url - a url is logged and repeated.
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
              # The scheduler's own pool, which the fan-out and handling jobs run on.
              jobsConfig:
                # Every session in UTC, as the columns hold UTC wall-clock time.
                dataSourceProperties:
                  options: -c TimeZone=UTC
                url: ${WALLET_DATABASE_URL:postgresql+psycopg://localhost:5432/wallet}
                username: ${WALLET_DATABASE_USERNAME:ekbatan}
                password: ${WALLET_DATABASE_PASSWORD:ekbatan}
                poolSize: 8

  # The whole saga choreography depends on the local-event-handler running - every step except
  # the first is started by an in-process event handler picking up the previous step's event
  # and running the next action.
  local-event-handler:
    handling:
      enabled: true

[project]
name = "fastapi-wallet-rest-mysql"
version = "0.1.0"
description = "A wallet service over HTTP on MySQL, built with Poetry."
requires-python = ">=3.13"
dependencies = [
    "ekbatan[mysql]",
    # ekbatan's own dependency, listed only so that the path below applies to it: Poetry
    # applies [tool.poetry.dependencies] only to what is listed here. Delete with that.
    "ekbatan-py-db-scheduler",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "fastapi_wallet_rest_mysql", from = "src" }]

# Poetry leaves a gitignored file out of the package, and schema.py is one. Name it.
[[tool.poetry.include]]
path = "src/fastapi_wallet_rest_mysql/schema.py"
format = ["sdist", "wheel"]

# ekbatan is not on PyPI yet. Until it is, it - and its scheduler - come from this
# repository; delete this once it is published.
[tool.poetry.dependencies]
ekbatan = { path = "../..", develop = true }
ekbatan-py-db-scheduler = { path = "../../db-scheduler", develop = true }

[tool.poetry.group.dev.dependencies]
# The schema generator: a build step, never a runtime dependency.
ekbatan = { path = "../..", develop = true, extras = ["codegen"] }
pytest = ">=8.0"
testcontainers = { version = ">=4.15", extras = ["mysql"] }
httpx = ">=0.27"

[tool.pytest.ini_options]
addopts = "-q"

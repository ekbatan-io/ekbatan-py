[project]
name = "fastapi-wallet-rest-async-mysql"
version = "0.1.0"
description = "A wallet service over HTTP on MySQL, on native asyncio, built with uv."
requires-python = ">=3.13"
dependencies = ["ekbatan[mysql,mysql-async,migrations]", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["ekbatan[codegen]", "pytest>=8.0", "testcontainers[mysql]>=4.15", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# schemagen's settings, as Java's build script carries jOOQ's: `make schema` runs
# `python -m ekbatan.schemagen`, which reads them. A flag on the command wins.
[tool.ekbatan.schemagen]
migrations = "src/fastapi_wallet_rest_async_mysql/migrations"
out = "src/fastapi_wallet_rest_async_mysql/schema.py"
image = "mysql:8.4"

# A uuid is stored as CHAR(36) here, like any text, so say which columns hold one: the ids.
[[tool.ekbatan.schemagen.forced-types]]
name = "uuid_column"
include-types = "CHAR\\(36\\)"
include-expression = ".*\\.id|.*_id"

# Every CHAR(3) column is a currency code, so the rule picks columns by their type.
[[tool.ekbatan.schemagen.forced-types]]
converter = "fastapi_wallet_rest_async_mysql.converters.CurrencyConverter"
include-types = "CHAR\\(3\\)"

[tool.pytest.ini_options]
addopts = "-q"

# ekbatan is not on PyPI yet. Until it is, it - and its scheduler - come from this
# repository; delete this once it is published.
[tool.uv.sources]
ekbatan = { path = "../..", editable = true }
ekbatan-py-db-scheduler = { path = "../../db-scheduler", editable = true }

[project]
name = "ekbatan"
version = "0.1.0.dev0"
description = "A persistence framework for event-driven systems, with an ergonomic built-in outbox pattern."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hossein Bakhtiari" }]
keywords = ["outbox", "persistence", "event-driven", "cdc", "sharding", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["SQLAlchemy>=2.0.30"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["PyMySQL>=1.1"]
mariadb = ["PyMySQL>=1.1"]
migrations = ["yoyo-migrations>=9.0"]
codegen = ["sqlacodegen>=4.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "sqlacodegen>=4.0",
]

[project.urls]
Homepage = "https://ekbatan-io.github.io/ekbatan/"
Source = "https://github.com/ekbatan-io/ekbatan-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekbatan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "examples"]

# Tests are checked, but not made to annotate every fixture and helper. Strictness in the
# library is a promise to its users; strictness in a test file is a tax on writing tests.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

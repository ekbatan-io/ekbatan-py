[project]
name = "ekbatan"
version = "0.1.0.dev0"
description = "A persistence framework for event-driven systems, with an ergonomic built-in outbox pattern."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Hossein Bakhtiari" }]
keywords = ["outbox", "persistence", "event-driven", "cdc", "sharding", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
# The db-scheduler port is pinned, as Java pins `com.github.kagkarlsson:db-scheduler` to one
# version in gradle.properties. Unbound, `pip install ekbatan` would take any future release of
# a distribution this repository cuts itself - and the two are released together.
#
# The `.dev0` in the pin is load-bearing while this is a pre-release: `~=0.1.0` excludes
# pre-releases, so it does not admit `0.1.0.dev0` and resolves to nothing at all. `uv sync`
# never notices, because [tool.uv.sources] below replaces the requirement with a path. A user
# installing from PyPI would be the first to find out. Drop the suffix at the first real
# release, and move the pin with every minor bump - the release workflow checks it.
# opentelemetry-api: as Java's ekbatan-core depends on it. On its own it records nothing; an
# application that wants spans and metrics installs an SDK.
dependencies = [
    "SQLAlchemy>=2.0.30",
    "ekbatan-py-db-scheduler~=0.1.0.dev0",
    "PyYAML>=6.0",
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["PyMySQL>=1.1"]
mariadb = ["PyMySQL>=1.1"]
# yoyo runs the SQL files; ekbatan.migrations adds the lock, the checks and the history on top.
# Pinned to a major version: the migrator subclasses yoyo's backends and relies on a handful of
# its methods, which tests/unit/test_yoyo_contract.py checks - a new major goes through that.
migrations = ["yoyo-migrations>=9.0,<10"]
# `schemagen` starts a throwaway database, migrates into it and reflects the result - Java
# does the same in its build. `sqlacodegen` is deliberately not here: it cannot force the
# per-dialect types, and a schema generated without that forcing corrupts data on MySQL.
codegen = ["testcontainers[postgres]>=4.15", "psycopg[binary]>=3.2"]
# The Redis-backed keyed lock, which Java ships as its own `ekbatan-keyed-lock-redis` module.
redis = ["redis>=6"]
# Native asyncio (`ekbatan.aio`): one extra per database, beside the sync ones, each naming
# that database's default async driver. aiomysql is built on PyMySQL, the sync default for
# MySQL and MariaDB. SQLAlchemy's own `asyncio` extra rather than a greenlet pin of ours: its
# asyncio API runs on greenlet, and SQLAlchemy is what says which one.
postgres-async = ["asyncpg>=0.30", "SQLAlchemy[asyncio]>=2.0.30"]
mysql-async = ["aiomysql>=0.2", "SQLAlchemy[asyncio]>=2.0.30"]
mariadb-async = ["aiomysql>=0.2", "SQLAlchemy[asyncio]>=2.0.30"]
sqlite-async = ["aiosqlite>=0.20", "SQLAlchemy[asyncio]>=2.0.30"]

[tool.uv.sources]
# The db-scheduler port lives in this repository, as `ekbatan-distributed-jobs` depends on the
# db-scheduler artifact on the Java side. It stays a separate distribution with its own build
# and its own tests; this only says where to find it.
ekbatan-py-db-scheduler = { path = "db-scheduler", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    # PyYAML ships no types of its own; the stubs keep `mypy --strict` checking the loader.
    "types-PyYAML>=6.0",
    "ruff>=0.6",
    # The suite runs on SQLite by default and against real servers with --dialects=all.
    "testcontainers[postgres,mysql]>=4.15",
    "psycopg[binary]>=3.2",
    "PyMySQL>=1.1",
    "redis>=6",
    # `ekbatan.aio`'s suite runs the same scenarios as the sync one, on each database's
    # default async driver.
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "SQLAlchemy[asyncio]>=2.0.30",
    # `make test-gevent` runs the suite under monkey-patching. The framework has no gevent
    # import of its own and needs none - this is here so "it works under gevent" stays a
    # checked statement rather than one nobody reran.
    "gevent>=25.4",
    # The migrator's suite runs yoyo against every dialect.
    "yoyo-migrations>=9.0,<10",
]

# The SDK, which makes spans and metrics actually record. Its own group rather than part of
# `dev` or an extra, so that every other CI job runs as an application with no SDK installed;
# one job asks for this group and asserts the span names and their scope.
tracing = ["opentelemetry-sdk>=1.27"]

# What the examples need and the framework does not. Its own group for the same reason as
# `tracing`: nothing in `src/` may import a web framework, and a group that is not installed
# by default is the cheapest way to keep that true.
examples = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx2>=2.0",
    # The REST examples migrate from files at startup, as a deployment does - so they need the
    # `migrations` extra, which the framework itself keeps optional.
    "yoyo-migrations>=9.0,<10",
]

[project.urls]
Homepage = "https://ekbatan-io.github.io/ekbatan/"
Source = "https://github.com/ekbatan-io/ekbatan-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekbatan"]
# Without this marker a checker ignores the package's annotations entirely, and every user
# gets the types of a library that shipped none - while the classifiers claim otherwise.
artifacts = ["src/ekbatan/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib so unit/ and integration/ can hold modules of the same name - they often should,
# being two halves of one subject - without an __init__.py in every directory.
addopts = "-q --import-mode=importlib"
markers = ["slow: needs a container"]
consider_namespace_packages = true

[tool.mypy]
python_version = "3.13"
strict = true
# The library and the examples, strictly. An example is documentation, and documentation that
# would not type-check is documentation that is wrong.
# The examples' uv projects; their pip and Poetry twins are the same code, kept so by
# scripts/sync-examples.py.
files = [
    "src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-pg/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-mysql/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-mariadb/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-sharded-pg/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-async-sharded-pg/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-async-pg/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-async-mysql/src",
    "ekbatan-py-examples/fastapi-wallet-rest-uv-async-mariadb/src",
    "ekbatan-py-examples/fastapi-wallet-saga-uv-pg/src",
    "ekbatan-py-examples/fastapi-wallet-saga-uv-async-pg/src",
    "ekbatan-py-examples/job-worker-uv-pg/src",
    "ekbatan-py-examples/job-worker-uv-async-pg/src",
    "ekbatan-py-examples/wallet-service-uv-sqlite/src",
    "ekbatan-py-examples/wallet-service-uv-async-sqlite/src",
]
# An example's own test is a test, and is held to the same bar as the rest of them.
exclude = "ekbatan-py-examples/.*/test_.*\\.py$"

# The SDK is not installed in most environments (see the `tracing` group).
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

# yoyo ships no type information. Only ekbatan._yoyo imports it, and only once something
# migrates, since the extra may legitimately be absent.
[[tool.mypy.overrides]]
module = "yoyo.*"
ignore_missing_imports = true

# Strictness in the library is a promise to its users; strictness in a test file is a tax on
# writing tests, so the suites are linted rather than type-checked.

[tool.ruff]
line-length = 100
src = ["src", "tests", "ekbatan-py-examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# The time kinds are `typing.NewType` labels: `Instant(x)` returns `x`, so a dataclass default
# built with one is the immutable datetime it was given.
extend-immutable-calls = [
  "ekbatan.time.Instant",
  "ekbatan.time.LocalDateTime",
  "ekbatan.time.OffsetDateTime",
]

[tool.ruff.lint.per-file-ignores]
# Written by `python -m ekbatan.codegen`, whose first line names the module it read: a long
# package name makes it longer than a line. Generated, and checked by scripts/check-builders.py.
"ekbatan-py-examples/*/src/*/builders.py" = ["E501"]
